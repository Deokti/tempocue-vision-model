[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcvm"
version = "0.1.0"
description = "TempoCue: сверка отрисовки, генератор синтетики и обучение модели распознавания миникарты"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
]

[tool.setuptools.packages.find]
where = ["src"]
